<style>
:root{--blue:#2454dc;--ink:#1c2940;--muted:#63728b;--bg:#f1f5fc;--line:#d8e2f1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}
body,button,input{font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}
.panel{background:#fff;border:1px solid #e5ebf5;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 22px #1b37600b}

.hero{background:linear-gradient(120deg,#2245bb,#4387ef);color:white;border-radius:20px;padding:22px}.hero h1{margin:0 0 4px;font-size:25px}
.hidden{display:none!important}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{cursor:pointer}.nav button,.btn,.jump button{border:0;border-radius:10px;padding:10px 13px;background:#e6edff;color:#21439b;font-weight:700}
.nav button.active,.btn.primary{background:var(--blue);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--blue);font-weight:700}
.progress{height:8px;background:#e9eef6;border-radius:9px;overflow:hidden;margin:13px 0}.progress i{display:block;height:100%;background:#18b6a3}
.question{font-size:19px;font-weight:700;margin:18px 0 12px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:13px;text-align:left;background:white;border:2px solid var(--line);border-radius:12px;color:var(--ink);font-size:16px}
.opt:disabled{cursor:default}.opt.correct{background:#ddf8e8;border-color:#18a34a}.opt.wrong{background:#ffe8e8;border-color:#dc2626}
.feedback{padding:14px;border-radius:12px;margin-top:14px;background:#effcf5;border:1px solid #9be5b8}.feedback.bad{background:#fff1f1;border-color:#efa5a5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.jump{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.jump button.done{background:#ddf8e8;border:1px solid #16a34a}
.passage{white-space:pre-wrap;border:1px solid var(--line);border-radius:12px;padding:18px;background:#fcfdff;max-height:58vh;overflow:auto;font-size:17px;line-height:1.8}
.reading-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px;margin:14px 0;align-items:start}
.read-pane,.questions-pane{min-width:0;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;height:68vh;overflow:auto}
.questions-pane .panel{margin:0 0 12px;box-shadow:none}
details.translation{margin:12px 0;border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8faff}
details.translation summary{cursor:pointer;color:var(--blue);font-weight:700}
.wordbank{background:#fff7d9;border:1px solid #f0df9c;border-radius:10px;padding:10px;margin:10px 0}
.picture{width:100%;height:auto;max-height:300px;object-fit:contain;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.typing{margin:6px 0 10px}.hint{background:#fff7d9;padding:12px;border-radius:10px;margin:10px 0}
.small{font-size:13px;color:var(--muted)}.scoreline{font-weight:700;color:var(--blue)}
@media(max-width:760px){.wrap{padding:10px}.opts{grid-template-columns:1fr}.reading-layout{grid-template-columns:1fr}.read-pane,.questions-pane{height:auto;max-height:48vh}.passage{max-height:42vh}.question{font-size:17px}}

<script>
const S=[{"title": "Pronunciation · Exercise 1", "mode": "single", "intro": "Circle the word in each line with the underlined part pronounced differently.", "questions": [{"prompt": "1. Which word has a different underlined sound?", "options": ["A. si<u>ng</u>er", "B. E<u>ng</u>land", "C. a<u>ng</u>le", "D. lo<u>n</u>gevity"], "correct": 3, "explain": "longevity /lɒnˈdʒev.ə.ti/ có âm /n/; các từ còn lại có âm /ŋ/.", "vi": "Chọn từ có phần gạch chân được phát âm khác."}, {"prompt": "2. Which word has a different underlined sound?", "options": ["A. la<u>n</u>guage", "B. ope<u>n</u>ing", "C. co<u>n</u>vert", "D. a<u>n</u>imal"], "correct": 0, "explain": "language /ˈlæŋ.ɡwɪdʒ/ có âm /ŋ/; các từ còn lại có âm /n/.", "vi": "Chọn từ có phần gạch chân được phát âm khác."}, {"prompt": "3. Which word has a different underlined sound?", "options": ["A. mor<u>n</u>ing", "B. thi<u>n</u>king", "C. u<u>n</u>ion", "D. or<u>n</u>ament"], "correct": 1, "explain": "thinking /ˈθɪŋ.kɪŋ/ có âm /ŋ/; các từ còn lại có âm /n/.", "vi": "Chọn từ có phần gạch chân được phát âm khác."}, {"prompt": "4. Which word has a different underlined sound?", "options": ["A. dri<u>n</u>k", "B. tha<u>n</u>k", "C. fu<u>n</u>ny", "D. u<u>n</u>cle"], "correct": 2, "explain": "funny /ˈfʌn.i/ có âm /n/; các từ còn lại có âm /ŋ/.", "vi": "Chọn từ có phần gạch chân được phát âm khác."}, {"prompt": "5. Which word has a different underlined sound?", "options": ["A. offeri<u>ng</u>", "B. traditio<u>n</u>", "C. you<u>ng</u>", "D. wri<u>n</u>kle"], "correct": 1, "explain": "tradition /trəˈdɪʃ.ən/ có âm /n/; các từ còn lại có âm /ŋ/.", "vi": "Chọn từ có phần gạch chân được phát âm khác."}]}, {"title": "Pronunciation · Exercise 2", "mode": "single", "intro": "Read the sentences aloud. Focus on the underlined words containing /n/ and /ŋ/.", "questions": [{"prompt": "1. She wants to become a folk <u>singer</u>.", "options": ["/n/", "/ŋ/"], "correct": 1, "explain": "singer có âm /ŋ/ ở phần cuối từ.", "vi": "Cô ấy muốn trở thành một ca sĩ dân gian."}, {"prompt": "2. Tet is a time for family <u>reunions</u> and <u>gatherings</u> with friends.", "options": ["The underlined words contain /n/ only.", "The underlined words contain /ŋ/ only.", "The underlined words contain both /n/ and /ŋ/."], "correct": 2, "explain": "reunions có âm /n/; gatherings có âm /ŋ/.", "vi": "Tết là thời gian sum họp gia đình và tụ họp bạn bè."}, {"prompt": "3. They had a <u>lion</u> <u>dance</u> group perform at their daughter's <u>wedding</u>.", "options": ["The underlined words contain /n/ only.", "The underlined words contain /ŋ/ only.", "The underlined words contain both /n/ and /ŋ/."], "correct": 2, "explain": "lion và wedding có âm /n/; dance có âm /n/ trong phần được nhấn theo bài luyện âm.", "vi": "Họ đã thuê một nhóm múa lân biểu diễn trong đám cưới của con gái họ."}, {"prompt": "4. The <u>Vietnamese</u> carefully prepare <u>offerings</u> for the <u>Kitchen</u> Gods.", "options": ["The underlined words contain /n/ only.", "The underlined words contain /ŋ/ only.", "The underlined words contain both /n/ and /ŋ/."], "correct": 2, "explain": "Vietnamese và offerings có âm /ŋ/ hoặc /n/ theo phần gạch chân trong bài; Kitchen có âm /n/.", "vi": "Người Việt Nam chuẩn bị lễ vật cúng Táo quân rất chu đáo."}, {"prompt": "5. <u>Everyone</u> needs to wait for the host to start <u>eating</u>.", "options": ["The underlined words contain /n/ only.", "The underlined words contain /ŋ/ only.", "The underlined words contain both /n/ and /ŋ/."], "correct": 2, "explain": "Everyone có âm /n/; eating có âm /ŋ/ ở đuôi -ing.", "vi": "Mọi người cần đợi chủ nhà bắt đầu ăn."}]}, {"title": "Vocabulary & Grammar · Exercise 1", "mode": "typing", "intro": "Look at the picture and complete the phrases. The first letters are given.", "image": "https://img.loigiaihay.com/picture/2023/1201/sbt-ta8-global-1.png", "questions": [{"prompt": "1. an o_______ t_______", "answer": "ornamental tree", "explain": "Ornamental tree là cụm danh từ chỉ cây cảnh; giữ đúng hai từ theo gợi ý chữ cái đầu.", "vi": "Cây cảnh."}, {"prompt": "2. a b_______ f_______", "answer": "blooming flower", "explain": "Blooming là tính từ có nghĩa đang nở; blooming flower là hoa nở.", "vi": "Một bông hoa đang nở."}, {"prompt": "3. a c_______ h_______", "answer": "communal house", "explain": "Communal house là cụm danh từ chỉ đình làng, nơi sinh hoạt chung của cộng đồng.", "vi": "Đình làng."}, {"prompt": "4. a b_______ p_______", "answer": "bamboo pole", "explain": "Bamboo là tre; pole là cây/cột dài.", "vi": "Một cây cọc tre."}, {"prompt": "5. b_______ s_______", "answer": "bad spirits", "explain": "Bad là xấu; spirits là các linh hồn/tà ma.", "vi": "Những linh hồn xấu xa / tà ma."}, {"prompt": "6. f_______ o_______", "answer": "food offerings", "explain": "Food offerings là đồ ăn được chuẩn bị để dâng cúng.", "vi": "Đồ ăn lễ vật / thức ăn cúng."}, {"prompt": "7. m_______ a_______", "answer": "martial arts", "explain": "Martial arts là cụm danh từ chỉ các môn võ thuật.", "vi": "Võ thuật."}, {"prompt": "8. f_______ g_______", "answer": "festival goers", "explain": "Festival goers là những người tham gia/đi dự lễ hội.", "vi": "Những người đi lễ hội."}]}, {"title": "Vocabulary & Grammar · Exercise 2", "mode": "single", "intro": "Choose the correct answer A, B, or C to complete each sentence.", "questions": [{"prompt": "1. In many cultures, a _____ represents youth, beauty, and pleasure.", "options": ["A. blooming flower", "B. communal house", "C. bamboo pole"], "correct": 0, "explain": "Blooming flower phù hợp với ý nghĩa tượng trưng cho tuổi trẻ, sắc đẹp và niềm vui.", "vi": "Trong nhiều nền văn hóa, một bông hoa nở tượng trưng cho tuổi trẻ, sắc đẹp và niềm vui."}, {"prompt": "2. _____ such as kumquat trees, peach blossoms, and apricot flowers are popular at Tet.", "options": ["A. Blooming flower", "B. Vegetables", "C. Ornamental trees"], "correct": 2, "explain": "Kumquat trees, peach blossoms và apricot flowers là các loại cây/hoa cảnh; cụm phù hợp là ornamental trees.", "vi": "Các loại cây cảnh như cây quất, hoa đào và hoa mai rất được ưa chuộng vào dịp Tết."}, {"prompt": "3. Traditionally, the _____ in a village is a place for villagers to meet or worship.", "options": ["A. festival", "B. market", "C. communal house"], "correct": 2, "explain": "Communal house là đình làng, nơi dân làng gặp gỡ hoặc thờ cúng.", "vi": "Theo truyền thống, đình làng là nơi dân làng gặp gỡ hoặc thờ cúng."}, {"prompt": "4. Every year, the Bulgarians hold the Surva Festival to chase away _____.", "options": ["A. bad spirits", "B. festival goers", "C. martial artists"], "correct": 0, "explain": "Chase away bad spirits nghĩa là xua đuổi tà ma.", "vi": "Hằng năm, người Bulgaria tổ chức Lễ hội Surva để xua đuổi tà ma."}, {"prompt": "5. In many Vietnamese villages, people put up a _____ in the yard of the communal house to welcome Tet.", "options": ["A. fight", "B. barrier", "C. bamboo pole"], "correct": 2, "explain": "Bamboo pole là cây nêu/cọc tre được dựng trong sân đình vào dịp Tết.", "vi": "Ở nhiều làng quê Việt Nam, người ta dựng một cây tre trong sân đình để đón Tết."}, {"prompt": "6. During Tet, the Kinh often prepare traditional _____ such as banh chung and boiled chicken to worship their ancestors.", "options": ["A. decorative items", "B. food offerings", "C. spirits"], "correct": 1, "explain": "Food offerings là đồ ăn được chuẩn bị để dâng cúng tổ tiên.", "vi": "Trong dịp Tết, người Kinh thường chuẩn bị các món ăn lễ vật truyền thống như bánh chưng và gà luộc để thờ cúng tổ tiên."}, {"prompt": "7. Last year, thousands of festival _____ participated in the Lim Festival in Tien Du District.", "options": ["A. comers", "B. goers", "C. movers"], "correct": 1, "explain": "Festival goers là người tham gia lễ hội.", "vi": "Năm ngoái, hàng nghìn người đi lễ hội đã tham gia Lễ hội Lim ở huyện Tiên Du."}, {"prompt": "8. Learning _____ can help build physical strength and improve confidence.", "options": ["A. martial arts", "B. physics", "C. chemistry"], "correct": 0, "explain": "Martial arts nghĩa là võ thuật; đây là hoạt động giúp rèn luyện thể lực và sự tự tin.", "vi": "Học võ thuật có thể giúp xây dựng sức mạnh thể chất và cải thiện sự tự tin."}]}, {"title": "Vocabulary & Grammar · Exercise 3", "mode": "reading", "intro": "Complete the text with the words from the box. Each blank is checked separately.", "wordbank": "break · custom · traditionally · maintain · practise · traditions", "passage": ["I think each family has their own customs and (1) _______. For example, my uncle's children always spend two weeks in the countryside in summer time. Holding a party on everyone's birthday is another custom they (2) _______. As for my family, it is becoming a (3) _______ for us to bake a special cake on the last Sunday of each month. We also have a home cinema night every Saturday when we enjoy a film together. For my extended family, (4) _______ we gather on the first day of the Lunar New Year.", "In my opinion, it is good for families to (5) _______ from time to time, they can (6) _______ their traditions. However, with tradition and try something new to add variety to their lives."], "translation": "Tôi nghĩ mỗi gia đình đều có phong tục và truyền thống riêng. Ví dụ, các con của chú tôi luôn dành hai tuần ở vùng nông thôn vào mùa hè. Tổ chức tiệc vào sinh nhật của mỗi người là một phong tục khác mà họ thực hiện. Đối với gia đình tôi, việc nướng một chiếc bánh đặc biệt vào Chủ nhật cuối cùng mỗi tháng đang trở thành một thông lệ. Chúng tôi cũng có một buổi tối xem phim tại nhà vào mỗi thứ Bảy. Với đại gia đình tôi, theo truyền thống, chúng tôi tụ họp vào ngày đầu tiên của Tết Nguyên đán. Theo lời giải được cung cấp, các gia đình nên duy trì theo thời gian và có thể phá vỡ một số truyền thống; đoạn gốc trên trang có cách diễn đạt chưa thật trọn vẹn ở phần cuối.", "questions": [{"prompt": "(1) customs and _____", "options": ["A. break", "B. custom", "C. traditionally", "D. maintain", "E. practise", "F. traditions"], "correct": 5, "explain": "Customs and traditions là cặp danh từ đi cùng nhau.", "vi": "Phong tục và truyền thống."}, {"prompt": "(2) another custom they _____", "options": ["A. break", "B. custom", "C. traditionally", "D. maintain", "E. practise", "F. traditions"], "correct": 4, "explain": "Practise a custom nghĩa là thực hiện một phong tục.", "vi": "Một phong tục khác mà họ thực hiện."}, {"prompt": "(3) becoming a _____", "options": ["A. break", "B. custom", "C. traditionally", "D. maintain", "E. practise", "F. traditions"], "correct": 1, "explain": "A custom: một phong tục/thói quen được hình thành.", "vi": "Đang trở thành một thông lệ."}, {"prompt": "(4) _____ we gather", "options": ["A. break", "B. custom", "C. traditionally", "D. maintain", "E. practise", "F. traditions"], "correct": 2, "explain": "Traditionally là trạng từ, bổ nghĩa cho hành động gather.", "vi": "Theo truyền thống, chúng tôi tụ họp."}, {"prompt": "(5) good for families to _____ from time to time", "options": ["A. break", "B. custom", "C. traditionally", "D. maintain", "E. practise", "F. traditions"], "correct": 3, "explain": "Đáp án theo phần lời giải trên trang là maintain.", "vi": "Duy trì theo thời gian (theo đáp án nguồn)."}, {"prompt": "(6) they can _____ their traditions", "options": ["A. break", "B. custom", "C. traditionally", "D. maintain", "E. practise", "F. traditions"], "correct": 0, "explain": "Break their traditions nghĩa là phá vỡ/thay đổi truyền thống.", "vi": "Họ có thể phá vỡ những truyền thống của mình."}]}, {"title": "Vocabulary & Grammar · Exercise 4", "mode": "single", "intro": "Complete each sentence with a, an, the, or 0 (zero article).", "questions": [{"prompt": "1. I lost my wallet on _____ last day of my stay in Paris.", "options": ["A. a", "B. an", "C. the", "D. 0 (no article)"], "correct": 2, "explain": "Dùng the trước last day vì đây là ngày cuối cùng xác định trong khoảng thời gian lưu trú.", "vi": "Tôi bị mất ví vào ngày cuối cùng của kỳ nghỉ ở Paris."}, {"prompt": "2. What are some things I should know about _____ Vietnamese table manners?", "options": ["A. a", "B. an", "C. the", "D. 0 (no article)"], "correct": 3, "explain": "Không dùng mạo từ khi nói chung về một khái niệm/nhóm quy tắc số nhiều: Vietnamese table manners.", "vi": "Có những điều gì tôi nên biết về phép lịch sự trên bàn ăn của người Việt?"}, {"prompt": "3. We often stay at home on New Year's Eve but this year was _____ exception.", "options": ["A. a", "B. an", "C. the", "D. 0 (no article)"], "correct": 1, "explain": "Exception bắt đầu bằng âm nguyên âm nên dùng an: an exception.", "vi": "Chúng tôi thường ở nhà vào đêm giao thừa nhưng năm nay là một ngoại lệ."}, {"prompt": "4. My village holds an annual festival that welcomes _____ thousands of festival goers.", "options": ["A. a", "B. an", "C. the", "D. 0 (no article)"], "correct": 3, "explain": "Không dùng mạo từ trước thousands of khi diễn tả số lượng hàng nghìn nói chung.", "vi": "Làng tôi tổ chức một lễ hội thường niên đón hàng nghìn người tham dự."}, {"prompt": "5. We went to _____ Chinese restaurant last night.", "options": ["A. a", "B. an", "C. the", "D. 0 (no article)"], "correct": 0, "explain": "Dùng a trước danh từ đếm được số ít Chinese restaurant khi nhắc đến lần đầu.", "vi": "Tối qua chúng tôi đã đến một nhà hàng Trung Quốc."}]}, {"title": "Vocabulary & Grammar · Exercise 5", "mode": "article-lines", "intro": "Some of the lines in the text below have an article which is incorrectly used. If the line has a wrong article, circle it and write the correct one on the right of the line. If the line is correct, put a tick (V).", "questions": [{"line": 1, "text": "Hung King Temple Festival is one of a national public", "answer": "the", "explain": "Cấu trúc one of the + danh từ số nhiều: “one of the national public holidays”. Thay “a” bằng “the”.", "vi": "Lễ hội Đền Hùng là một trong những ngày nghỉ lễ quốc gia của Việt Nam."}, {"line": 2, "text": "holidays of Viet Nam. The festival aims to remember and", "answer": "V", "explain": "Dòng này dùng mạo từ đúng. “The festival” nhắc lại lễ hội Đền Hùng đã được giới thiệu ở dòng trước. Điền dấu tick (V).", "vi": "... của Việt Nam. Lễ hội nhằm tưởng nhớ và thờ cúng các Vua Hùng."}, {"line": 3, "text": "worship the Hung Kings, the first kings of a nation. It is often", "answer": "the", "explain": "“The nation” chỉ quốc gia cụ thể đang được nói đến (Việt Nam), vì vậy thay “a” bằng “the”.", "vi": "... thờ cúng các Vua Hùng, những vị vua đầu tiên của dân tộc. Lễ hội thường được tổ chức..."}, {"line": 4, "text": "held between a first and the 10th day of the third lunar month.", "answer": "the", "explain": "Dùng “the” trước số thứ tự “first”: the first day. Thay “a” bằng “the”.", "vi": "... diễn ra từ ngày mùng 1 đến ngày mùng 10 của tháng thứ ba âm lịch."}, {"line": 5, "text": "The main ceremony happens at a Hung King Temple in", "answer": "the", "explain": "Bài nói đến địa điểm cụ thể là Đền thờ Vua Hùng, nên dùng “the” theo đáp án của bài. Thay “a” bằng “the”.", "vi": "Buổi lễ chính diễn ra tại Đền thờ Vua Hùng ở..."}, {"line": 6, "text": "Viet Tri City, Phu Tho Province. Each year, about four million", "answer": "V", "explain": "“Four million festival goers” là danh từ số nhiều có số lượng cụ thể; không cần mạo từ. Dòng này đúng, điền V.", "vi": "... thành phố Việt Trì, tỉnh Phú Thọ. Mỗi năm, khoảng bốn triệu..."}, {"line": 7, "text": "festival goers arrive at the Phu Tho to join the festivities.", "answer": "0", "explain": "Tên địa danh “Phu Tho” không dùng “the” trong cách dùng này. Xóa “the” và điền 0 (zero article).", "vi": "... người đi lễ hội đến Phú Thọ để tham gia các hoạt động lễ hội."}, {"line": 8, "text": "There are over 1,400 Hung King Temples across Viet Nam, so", "answer": "V", "explain": "Tên quốc gia “Viet Nam” không dùng mạo từ “the”. Dòng này đúng, điền V.", "vi": "Có hơn 1.400 đền thờ Vua Hùng trên khắp Việt Nam, vì vậy..."}, {"line": 9, "text": "whether you visit a main temple in Phu Tho or not, you can", "answer": "the", "explain": "“The main temple” chỉ ngôi đền chính cụ thể ở Phú Thọ. Thay “a” bằng “the”.", "vi": "... dù bạn có đến thăm ngôi đền chính ở Phú Thọ hay không, bạn vẫn có thể..."}, {"line": 10, "text": "be an part of the festivities at any place in the country.", "answer": "a", "explain": "“Part” bắt đầu bằng âm phụ âm /p/, nên dùng “a part”, không dùng “an part”. Thay “an” bằng “a”.", "vi": "... là một phần của các hoạt động lễ hội ở bất kỳ nơi nào trong cả nước."}]}, {"title": "Speaking · Exercise 1", "mode": "single", "intro": "Choose the most suitable response A or B to complete each exchange.", "questions": [{"prompt": "1. A: What gift should I bring to Jane's house-warming party? B: _____", "options": ["A. How about buying her an ornamental tree?", "B. Sorry, but I'm busy on Friday."], "correct": 0, "explain": "Đây là lời gợi ý quà tân gia phù hợp với câu hỏi What gift...?", "vi": "A: Tôi nên mang món quà gì đến tiệc tân gia của Jane? B: Hay là mua tặng cô ấy một cây cảnh?"}, {"prompt": "2. A: Minh keeps making fun of me in class. What should I do? B: _____", "options": ["A. Oh dear. He's so impolite.", "B. Perhaps you could try talking to him seriously."], "correct": 1, "explain": "Câu hỏi What should I do? cần một lời khuyên, vì vậy chọn Perhaps you could...", "vi": "A: Minh cứ trêu chọc tôi trong lớp. Tôi nên làm gì? B: Có lẽ bạn nên thử nói chuyện nghiêm túc với cậu ấy."}, {"prompt": "3. A: Mai is always sending messages to me late at night. This wakes me up. B: _____", "options": ["A. Don't reply to her late messages, and she'll soon stop sending them.", "B. Poor you! You must be very sleepy then."], "correct": 0, "explain": "Lời khuyên không trả lời tin nhắn sẽ giúp giải quyết vấn đề được nêu.", "vi": "A: Mai luôn nhắn tin cho tôi vào đêm khuya. Điều đó làm tôi thức giấc. B: Đừng trả lời tin nhắn muộn của cô ấy, rồi cô ấy sẽ sớm ngừng gửi."}, {"prompt": "4. A: I'm going to Summer Carnival in Ha Long next week! B: _____", "options": ["A. That sounds exciting!", "B. It's a good idea to bring a warm coat."], "correct": 0, "explain": "Đây là phản hồi thể hiện sự hào hứng khi nghe tin bạn sắp tham gia lễ hội.", "vi": "A: Tuần tới tôi sẽ tham gia Lễ hội mùa hè ở Hạ Long! B: Nghe thật thú vị!"}, {"prompt": "5. A: Jack wants to go somewhere for Mid-Autumn Festival. B: _____", "options": ["A. Tell him to wait for a few minutes.", "B. He should definitely go to Hoi An."], "correct": 1, "explain": "B đưa ra gợi ý địa điểm phù hợp với mong muốn đi đâu đó dịp Trung thu.", "vi": "A: Jack muốn đi đâu đó vào dịp Trung thu. B: Cậu ấy chắc chắn nên đến Hội An."}]}, {"title": "Speaking · Exercise 2", "mode": "all", "intro": "Choose A–E to complete Elena and Minh's conversation. The five answer choices below are displayed as full phrases.", "questions": [{"prompt": "Blank (1): Elena asks whether Minh's family spend time together. Minh: _____", "options": ["A. Yes. We cheer our favourite football team whenever they play.", "B. Sometimes we even go to the opponent's stadium with our team's fan club.", "C. We do. My grandfather was a football player, so by tradition, we are all football fans.", "D. Well, my three uncles are football players too.", "E. He broke with tradition. He's now a businessman."], "correct": 0, "explain": "Câu trả lời mở đầu trực tiếp xác nhận gia đình thường cùng nhau cổ vũ đội bóng.", "vi": "Có. Chúng tôi cổ vũ đội bóng yêu thích mỗi khi họ thi đấu."}, {"prompt": "Blank (2): Elena asks if they watch the team at the stadium. Minh: That's right. _____", "options": ["A. Yes. We cheer our favourite football team whenever they play.", "B. Sometimes we even go to the opponent's stadium with our team's fan club.", "C. We do. My grandfather was a football player, so by tradition, we are all football fans.", "D. Well, my three uncles are football players too.", "E. He broke with tradition. He's now a businessman."], "correct": 1, "explain": "That's right xác nhận việc xem tại sân vận động; câu tiếp theo bổ sung họ còn đến sân đối thủ cùng hội cổ động viên.", "vi": "Đúng vậy. Đôi khi chúng tôi còn đến sân vận động của đội đối thủ cùng câu lạc bộ cổ động viên của đội mình."}, {"prompt": "Blank (3): Elena says the family must love football. Minh: _____", "options": ["A. Yes. We cheer our favourite football team whenever they play.", "B. Sometimes we even go to the opponent's stadium with our team's fan club.", "C. We do. My grandfather was a football player, so by tradition, we are all football fans.", "D. Well, my three uncles are football players too.", "E. He broke with tradition. He's now a businessman."], "correct": 2, "explain": "We do xác nhận họ rất yêu bóng đá; câu sau giải thích truyền thống gia đình.", "vi": "Đúng vậy. Ông tôi từng là cầu thủ bóng đá nên theo truyền thống, tất cả chúng tôi đều là người hâm mộ bóng đá."}, {"prompt": "Blank (4): Elena asks if other relatives play football. Minh: _____", "options": ["A. Yes. We cheer our favourite football team whenever they play.", "B. Sometimes we even go to the opponent's stadium with our team's fan club.", "C. We do. My grandfather was a football player, so by tradition, we are all football fans.", "D. Well, my three uncles are football players too.", "E. He broke with tradition. He's now a businessman."], "correct": 3, "explain": "Câu hỏi về những người thân khác chơi bóng đá; câu trả lời nhắc đến ba người chú.", "vi": "À, ba người chú của tôi cũng là cầu thủ bóng đá."}, {"prompt": "Blank (5): Elena asks about Minh's dad. Minh: _____", "options": ["A. Yes. We cheer our favourite football team whenever they play.", "B. Sometimes we even go to the opponent's stadium with our team's fan club.", "C. We do. My grandfather was a football player, so by tradition, we are all football fans.", "D. Well, my three uncles are football players too.", "E. He broke with tradition. He's now a businessman."], "correct": 4, "explain": "He broke with tradition liên kết với câu hỏi về bố và cho biết ông không tiếp nối truyền thống bóng đá.", "vi": "Ông ấy đã phá vỡ truyền thống. Hiện giờ ông ấy là một doanh nhân."}]}, {"title": "Reading · Exercise 1", "mode": "reading", "intro": "Choose A, B, or C to fill in each blank. The reading passage is shown in full; Vietnamese translation is hidden in a dropdown.", "passage": "The Kate Festival\n\nThe Kate Festival is (1) _________ most important festival of the Cham in Viet Nam. It is held for three days at the beginning of October. The main ceremony takes (2) ________ in Po Rume, Po Nugar, and Po Klong Garai towers in Ninh Thuan Province. The festival helps people remember Cham heroes and (3) __________ their ancestors. It is also a time for people to relax, visit each other, and wish others (4) ___________ luck.\n\nFor festival goers, it is a great opportunity to (5) _________ the beauty in the Cham culture. The ceremony starts with people calling their ancestors and gods. Then, they (6) ________ for health and prosperity. The festival follows with (7) ________ traditional music and dance performances. The festival is full (8) ________ sounds and colours, and is a wonderful time for both the locals and visitors.", "translation": "Lễ hội Katê\n\nLễ hội Katê là lễ hội quan trọng nhất của người Chăm ở Việt Nam. Lễ hội được tổ chức trong ba ngày vào đầu tháng Mười. Phần lễ chính diễn ra tại các tháp Po Rume, Po Nugar và Po Klong Garai ở tỉnh Ninh Thuận. Lễ hội giúp mọi người tưởng nhớ các anh hùng Chăm và thờ cúng tổ tiên. Đây cũng là dịp để mọi người thư giãn, thăm hỏi nhau và chúc nhau may mắn.\n\nĐối với người tham gia lễ hội, đây là cơ hội tuyệt vời để trải nghiệm vẻ đẹp trong văn hóa Chăm. Buổi lễ bắt đầu bằng việc mọi người gọi tên tổ tiên và các vị thần. Sau đó, họ cầu nguyện cho sức khỏe và sự thịnh vượng. Tiếp theo là các tiết mục âm nhạc và múa truyền thống. Lễ hội tràn ngập âm thanh và màu sắc, là khoảng thời gian tuyệt vời đối với cả người dân địa phương và du khách.", "questions": [{"prompt": "(1) The Kate Festival is _____ most important festival of the Cham.", "options": ["A. 0 (no article)", "B. a", "C. the"], "correct": 2, "explain": "Cấu trúc so sánh nhất: the most + tính từ.", "vi": "Lễ hội Katê là lễ hội quan trọng nhất của người Chăm."}, {"prompt": "(2) The main ceremony takes _____ in the towers.", "options": ["A. place", "B. time", "C. effort"], "correct": 0, "explain": "Cụm cố định take place = diễn ra.", "vi": "Buổi lễ chính diễn ra tại các ngọn tháp."}, {"prompt": "(3) The festival helps people remember Cham heroes and _____ their ancestors.", "options": ["A. worship", "B. offer", "C. miss"], "correct": 0, "explain": "Worship their ancestors = thờ cúng tổ tiên.", "vi": "Lễ hội giúp mọi người tưởng nhớ các anh hùng Chăm và thờ cúng tổ tiên."}, {"prompt": "(4) ... wish others _____ luck.", "options": ["A. nice", "B. good", "C. happy"], "correct": 1, "explain": "Cụm từ cố định good luck = may mắn.", "vi": "... chúc người khác may mắn."}, {"prompt": "(5) ... an opportunity to _____ the beauty in the Cham culture.", "options": ["A. look", "B. experience", "C. show"], "correct": 1, "explain": "Experience the beauty = trải nghiệm/cảm nhận vẻ đẹp.", "vi": "... một cơ hội để trải nghiệm vẻ đẹp trong văn hóa Chăm."}, {"prompt": "(6) Then, they _____ for health and prosperity.", "options": ["A. search", "B. work", "C. pray"], "correct": 2, "explain": "Pray for = cầu nguyện cho.", "vi": "Sau đó, họ cầu nguyện cho sức khỏe và sự thịnh vượng."}, {"prompt": "(7) ... follows with _____ traditional music and dance performances.", "options": ["A. the", "B. 0 (no article)", "C. a"], "correct": 1, "explain": "Danh từ số nhiều traditional music and dance performances mang nghĩa chung nên không dùng mạo từ.", "vi": "... tiếp nối bằng các tiết mục âm nhạc và múa truyền thống."}, {"prompt": "(8) The festival is full _____ sounds and colours.", "options": ["A. of", "B. with", "C. for"], "correct": 0, "explain": "Cụm cố định be full of = đầy/tràn ngập.", "vi": "Lễ hội tràn ngập âm thanh và màu sắc."}]}, {"title": "Reading · Exercise 2", "mode": "reading", "intro": "Read the passage and choose the correct option A, B, or C for each question.", "passage": "A Longevity Celebration\n\nOn the fifth day of Tet, Binh An Village holds a longevity celebration for elderly people over 70. This tradition has continued for centuries in the village.\n\nIn the morning, everyone dresses nicely and walks to the village temple. According to tradition, the elderly wear traditional ao dai. They sit at the most honourable place. The village leaders congratulate them. They offer each elder a “longevity flag” and a bunch of flowers. Then, each family takes photographs with their elders. At noon, families hold a home party for their elders. It is customary for the family members to cook for their elders.\n\nThe traditional dishes served are five-colour sticky rice, steamed chicken, spring rolls, and deep-fried fish.\n\nThe longevity celebration is important to all villagers. It is an opportunity for them to show their respect to the elders. It is also a great time for family gatherings.", "translation": "Lễ mừng thọ\n\nVào ngày mùng năm Tết, làng Bình An tổ chức lễ mừng thọ cho những người cao tuổi trên 70. Truyền thống này đã được duy trì trong làng suốt nhiều thế kỷ.\n\nVào buổi sáng, mọi người ăn mặc đẹp và đi bộ đến đình làng. Theo truyền thống, người cao tuổi mặc áo dài truyền thống. Họ ngồi ở vị trí trang trọng nhất. Các trưởng làng chúc mừng họ. Họ tặng mỗi cụ một “lá cờ trường thọ” và một bó hoa. Sau đó, mỗi gia đình chụp ảnh cùng những người lớn tuổi. Buổi trưa, các gia đình tổ chức tiệc tại nhà cho người cao tuổi. Theo phong tục, các thành viên trong gia đình sẽ nấu ăn cho họ.\n\nCác món ăn truyền thống được phục vụ gồm xôi ngũ sắc, gà hấp, chả giò và cá chiên giòn.\n\nLễ mừng thọ có ý nghĩa quan trọng với tất cả dân làng. Đây là dịp để họ thể hiện sự kính trọng với người cao tuổi. Đây cũng là thời gian tuyệt vời để gia đình sum họp.", "questions": [{"prompt": "1. What is the passage mainly about?", "options": ["A. A celebration for the elderly.", "B. A spring festival.", "C. A cooking contest."], "correct": 0, "explain": "Tiêu đề và toàn bài đều mô tả lễ mừng thọ dành cho người cao tuổi.", "vi": "Đoạn văn chủ yếu nói về điều gì?"}, {"prompt": "2. How do people go to the village temple?", "options": ["A. By car.", "B. By motorbike.", "C. On foot."], "correct": 2, "explain": "Thông tin trong bài: “everyone dresses nicely and walks to the village temple”.", "vi": "Mọi người đi đến đình làng bằng cách nào?"}, {"prompt": "3. According to the passage, what do the elders NOT do during the official ceremony?", "options": ["A. Sit at an honourable place.", "B. Take photographs of the event.", "C. Receive congratulations from other people."], "correct": 1, "explain": "Bài nói mỗi gia đình chụp ảnh với người cao tuổi sau phần nghi lễ; trong phần nghi lễ, họ ngồi ở nơi trang trọng và được chúc mừng.", "vi": "Theo bài đọc, người cao tuổi KHÔNG làm gì trong buổi lễ chính thức?"}, {"prompt": "4. Who cooks at the home party?", "options": ["A. The elderly.", "B. The nearby restaurant.", "C. The family members."], "correct": 2, "explain": "Bài nêu rõ: “It is customary for the family members to cook for their elders.”", "vi": "Ai nấu ăn trong bữa tiệc tại nhà?"}, {"prompt": "5. The celebration is important to Binh An villagers because", "options": ["A. it shows that they respect the elders.", "B. it is an opportunity to admire their culture.", "C. it is a great opportunity for them to gather."], "correct": 0, "explain": "Câu trong bài: “It is an opportunity for them to show their respect to the elders.”", "vi": "Lễ mừng thọ quan trọng với dân làng Bình An vì lý do gì?"}]}, {"title": "Reading · Exercise 3a", "mode": "reading", "intro": "Read the passage and decide whether each statement is True or False.", "passage": "Popular Traditions in Britain\n\nWhen one thinks of the British, one often imagines people drinking tea and eating fish and chips. But there are many other traditions that British people have maintained for centuries.\n\nPancake Day\n\nPancake Day is also called Shrove Tuesday, and it is a day people make pancakes. They hold a pancake race. Runners wear a traditional apron and scarf and carry a pan with a pancake in it. They have to flip the pancake as they run. The first person to reach the finish line with their pancake is the winner.\n\nChristmas\n\nChristmas is on 25th December but people prepare for it long before the event. Christmas trees are everywhere. People decorate the trees and place gifts under them. They cook traditional foods, wear their best clothes, and have family reunions.\n\nNew Year Countdown\n\nOn New Year's Eve, crowds gather at Trafalgar Square or Piccadilly Circus to wait for the start of the new year. At midnight, there is a huge fireworks celebration over the London Eye, followed by Big Ben ringing in the New Year and people singing Auld Lang Syne.", "translation": "Những truyền thống phổ biến ở Anh\n\nKhi nghĩ về người Anh, người ta thường hình dung mọi người uống trà và ăn cá cùng khoai tây chiên. Nhưng còn nhiều truyền thống khác mà người Anh đã duy trì trong nhiều thế kỷ.\n\nNgày bánh kếp\n\nPancake Day còn được gọi là Shrove Tuesday, là ngày mọi người làm bánh kếp. Họ tổ chức cuộc đua bánh kếp. Người chạy đeo tạp dề và khăn quàng cổ truyền thống, đồng thời mang theo một chiếc chảo có bánh kếp bên trong. Họ phải lật bánh khi chạy. Người đầu tiên về đích cùng chiếc bánh kếp của mình là người chiến thắng.\n\nGiáng sinh\n\nGiáng sinh diễn ra vào ngày 25 tháng 12 nhưng mọi người chuẩn bị từ rất lâu trước đó. Cây thông Noel có ở khắp nơi. Mọi người trang trí cây và đặt quà bên dưới. Họ nấu các món ăn truyền thống, mặc quần áo đẹp nhất và đoàn tụ gia đình.\n\nĐếm ngược năm mới\n\nVào đêm giao thừa, đám đông tụ tập tại Quảng trường Trafalgar hoặc Piccadilly Circus để chờ năm mới bắt đầu. Lúc nửa đêm, có màn pháo hoa lớn trên London Eye, tiếp theo là tiếng chuông Big Ben chào năm mới và mọi người hát Auld Lang Syne.", "questions": [{"prompt": "1. The British are famous for the tradition of coffee drinking.", "options": ["A. True", "B. False"], "correct": 1, "explain": "Bài đọc nhắc đến người Anh uống trà (tea), không phải cà phê.", "vi": "Người Anh nổi tiếng với truyền thống uống cà phê."}, {"prompt": "2. Pancake Day always falls on a Wednesday.", "options": ["A. True", "B. False"], "correct": 1, "explain": "Pancake Day còn được gọi là Shrove Tuesday, tức thứ Ba, không phải thứ Tư.", "vi": "Ngày bánh kếp luôn rơi vào thứ Tư."}, {"prompt": "3. Christmas is a time for family gatherings.", "options": ["A. True", "B. False"], "correct": 0, "explain": "Thông tin: “... have family reunions.”", "vi": "Giáng sinh là thời gian sum họp gia đình."}, {"prompt": "4. Many British people go outdoors to count down for the new year.", "options": ["A. True", "B. False"], "correct": 0, "explain": "Bài đọc nói đám đông tụ tập tại Trafalgar Square hoặc Piccadilly Circus vào đêm giao thừa.", "vi": "Nhiều người Anh ra ngoài trời để đếm ngược đón năm mới."}, {"prompt": "5. At the turning of the new year, there is a fireworks display on Big Ben.", "options": ["A. True", "B. False"], "correct": 1, "explain": "Pháo hoa diễn ra trên London Eye; Big Ben rung chuông chào năm mới.", "vi": "Vào thời khắc chuyển giao năm mới, có màn pháo hoa trên Big Ben."}]}, {"title": "Reading · Exercise 3b", "mode": "reading", "intro": "Match the information with the traditions. Some traditions can be used twice.", "passage": "Popular Traditions in Britain\n\nWhen one thinks of the British, one often imagines people drinking tea and eating fish and chips. But there are many other traditions that British people have maintained for centuries.\n\nPancake Day\n\nPancake Day is also called Shrove Tuesday, and it is a day people make pancakes. They hold a pancake race. Runners wear a traditional apron and scarf and carry a pan with a pancake in it. They have to flip the pancake as they run. The first person to reach the finish line with their pancake is the winner.\n\nChristmas\n\nChristmas is on 25th December but people prepare for it long before the event. Christmas trees are everywhere. People decorate the trees and place gifts under them. They cook traditional foods, wear their best clothes, and have family reunions.\n\nNew Year Countdown\n\nOn New Year's Eve, crowds gather at Trafalgar Square or Piccadilly Circus to wait for the start of the new year. At midnight, there is a huge fireworks celebration over the London Eye, followed by Big Ben ringing in the New Year and people singing Auld Lang Syne.", "translation": "Những truyền thống phổ biến ở Anh\n\nKhi nghĩ về người Anh, người ta thường hình dung mọi người uống trà và ăn cá cùng khoai tây chiên. Nhưng còn nhiều truyền thống khác mà người Anh đã duy trì trong nhiều thế kỷ.\n\nNgày bánh kếp\n\nPancake Day còn được gọi là Shrove Tuesday, là ngày mọi người làm bánh kếp. Họ tổ chức cuộc đua bánh kếp. Người chạy đeo tạp dề và khăn quàng cổ truyền thống, đồng thời mang theo một chiếc chảo có bánh kếp bên trong. Họ phải lật bánh khi chạy. Người đầu tiên về đích cùng chiếc bánh kếp của mình là người chiến thắng.\n\nGiáng sinh\n\nGiáng sinh diễn ra vào ngày 25 tháng 12 nhưng mọi người chuẩn bị từ rất lâu trước đó. Cây thông Noel có ở khắp nơi. Mọi người trang trí cây và đặt quà bên dưới. Họ nấu các món ăn truyền thống, mặc quần áo đẹp nhất và đoàn tụ gia đình.\n\nĐếm ngược năm mới\n\nVào đêm giao thừa, đám đông tụ tập tại Quảng trường Trafalgar hoặc Piccadilly Circus để chờ năm mới bắt đầu. Lúc nửa đêm, có màn pháo hoa lớn trên London Eye, tiếp theo là tiếng chuông Big Ben chào năm mới và mọi người hát Auld Lang Syne.", "questions": [{"prompt": "1. All participants sing a song at a specific time.", "options": ["A. Pancake race", "B. Christmas", "C. New Year Countdown"], "correct": 2, "explain": "Mọi người hát Auld Lang Syne vào lúc nửa đêm trong phần đếm ngược năm mới.", "vi": "Tất cả người tham gia hát một bài hát vào một thời điểm cụ thể."}, {"prompt": "2. Lots of preparation happens before the event.", "options": ["A. Pancake race", "B. Christmas", "C. New Year Countdown"], "correct": 1, "explain": "Bài đọc nói mọi người chuẩn bị cho Giáng sinh từ rất lâu trước ngày lễ.", "vi": "Có nhiều sự chuẩn bị diễn ra trước sự kiện."}, {"prompt": "3. Participants have to wear a specific costume.", "options": ["A. Pancake race", "B. Christmas", "C. New Year Countdown"], "correct": 0, "explain": "Người chạy trong cuộc đua bánh kếp mặc tạp dề và khăn quàng truyền thống.", "vi": "Người tham gia phải mặc trang phục cụ thể."}, {"prompt": "4. Piccadilly Circus is crowded at this time.", "options": ["A. Pancake race", "B. Christmas", "C. New Year Countdown"], "correct": 2, "explain": "Đám đông tụ tập ở Piccadilly Circus vào đêm giao thừa.", "vi": "Piccadilly Circus đông đúc vào thời điểm này."}, {"prompt": "5. Participants race with a traditional food.", "options": ["A. Pancake race", "B. Christmas", "C. New Year Countdown"], "correct": 0, "explain": "Người chạy mang chảo có bánh kếp và lật bánh khi chạy.", "vi": "Người tham gia chạy đua với một món ăn truyền thống."}]}],W=[{"prompt": "1. We travelled to Hue on the train. (BY) → We travelled to _________.", "answer": ["Hue by train", "Hue by train."], "explain": "Cấu trúc phương tiện: by + phương tiện giao thông (by train). Không dùng the trước phương tiện sau by.", "vi": "Chúng tôi đã đi đến Huế bằng tàu hỏa."}, {"prompt": "2. We walked to the village temple. (FOOT) → We went _________.", "answer": ["to the village temple on foot", "to the village temple on foot."], "explain": "Cụm cố định on foot = đi bộ. Cấu trúc: go/walk to + địa điểm; on foot chỉ phương tiện.", "vi": "Chúng tôi đã đi bộ đến ngôi đình của làng."}, {"prompt": "3. Canada's capital is Ottawa. (CANADA) → Ottawa _________.", "answer": ["is the capital of Canada", "is the capital of Canada."], "explain": "Cấu trúc: the capital of + quốc gia/thành phố. Đổi vị trí chủ ngữ nhưng giữ nguyên ý nghĩa.", "vi": "Ottawa là thủ đô của Canada."}, {"prompt": "4. Vietnamese people value hard work and honesty. (THE) → _________ value hard work and honesty.", "answer": ["The Vietnamese", "The Vietnamese value hard work and honesty", "The Vietnamese value hard work and honesty."], "explain": "The + tên quốc tịch ở dạng tính từ có thể chỉ toàn thể người dân thuộc quốc gia đó: the Vietnamese.", "vi": "Người Việt Nam coi trọng sự chăm chỉ và tính trung thực."}, {"prompt": "5. My dad is not a coffee drinker. (DRINK) → My dad _________ coffee.", "answer": ["doesn't drink", "does not drink", "never drinks", "doesn't drink coffee", "does not drink coffee", "never drinks coffee"], "explain": "Dùng hiện tại đơn phủ định: S + do/does not + V nguyên mẫu. Với chủ ngữ số ít he/she/it/my dad dùng does not + drink. Có thể dùng never + V-s/es.", "vi": "Bố tôi không uống cà phê / Bố tôi không bao giờ uống cà phê."}];let si=0,qi=0,answers={},writingAnswers={},hints={};
const $=id=>document.getElementById(id);
function unlock(){if($('pw').value==='367'){$('login').classList.add('hidden');$('app').classList.remove('hidden');drawNav();render()}else $('err').textContent='Incorrect password.'}
function drawNav(){$('nav').innerHTML=S.map((s,i)=>`<button class="${i===si?'active':''}" onclick="si=${i};qi=0;drawNav();render()">${esc(s.title)}</button>`).join('')+`<button class="${si===S.length?'active':''}" onclick="si=${S.length};qi=0;drawNav();render()">Writing · Exercise 1</button>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function plain(x){return String(x).replace(/<[^>]*>/g,'')}
function score(s,a){return s.questions.filter((q,i)=>a[i]===q.correct).length}
function resetSection(){if(confirm('Reset all answers in this section?')){if(si===S.length){writingAnswers={};hints={}}else delete answers[si];qi=0;render()}}
function previous(){qi=Math.max(0,qi-1);render()}
function next(){let n=si===S.length?W.length:S[si].questions.length;qi=Math.min(n-1,qi+1);render()}
function jumpButtons(n,store){return `<div class="jump">${Array.from({length:n},(_,i)=>`<button class="${store[i]!==undefined?'done':''}" onclick="qi=${i};render()">${i+1}</button>`).join('')}</div>`}
function render(){if(si===S.length){renderWriting();return}let s=S[si],a=answers[si]||{};if(s.mode==='reading'||s.mode==='all'){renderAll(s,a);return}if(s.mode==='typing'){renderTypingSection(s,a);return}if(s.mode==='article-lines'){renderArticleLine(s,a);return}renderOne(s,a)}

function renderArticleLine(s,a){
let q=s.questions[qi],v=a[qi],done=Object.keys(a).length,total=s.questions.length;
let fb=v?`<div class="feedback ${v.ok?'':'bad'}"><b>${v.ok?'Correct!':'Incorrect.'}</b><p><b>Correction:</b> ${esc(q.answer==='V'?'✓ (V)':q.answer==='0'?'0 (zero article)':q.answer)}</p><p><b>Giải thích:</b> ${q.explain}</p><p><b>Nghĩa tiếng Việt:</b> ${q.vi}</p></div>`:'';
let input=`<input class="typing" id="articleanswer" placeholder="Write the correction (e.g. the, a, 0 or V)" value="${v?esc(v.text):''}" ${v?'disabled':''}>`;
$('main').innerHTML=`<div class="meta"><span>${esc(s.title)}</span><span>Line ${qi+1} / ${total}</span><span>Score: ${Object.values(a).filter(x=>x.ok).length} / ${total}</span></div><div class="progress"><i style="width:${done/total*100}%"></i></div><p>${esc(s.intro)}</p>${jumpButtons(total,a)}
<div class="panel" style="background:#fff9f7;border:1px solid #edc9c2">
<table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f8d9d2"><th style="padding:10px;text-align:left;width:58px">Line</th><th style="padding:10px;text-align:left">The text</th><th style="padding:10px;text-align:left;width:180px">Correction</th></tr></thead>
<tbody><tr><td style="padding:14px 10px;font-weight:bold;color:#e34b55;vertical-align:top">${q.line}.</td><td style="padding:14px 10px;font-size:18px;vertical-align:top">${esc(q.text)}</td><td style="padding:10px;vertical-align:top">${input}</td></tr></tbody></table>
</div>
${fb}<div class="actions">${v?`<button class="btn" onclick="resetArticleLine()">Reset this line</button>`:`<button class="btn primary" onclick="checkArticleLine()">CHECK</button>`}<button class="btn" onclick="previous()" ${qi===0?'disabled':''}>Previous</button><button class="btn primary" onclick="next()" ${qi===total-1?'disabled':''}>Next</button><button class="btn" onclick="resetSection()">Reset this section</button></div>`;
}
function normalizeArticle(x){return String(x).trim().toLowerCase().replace(/[✓✔]/g,'v').replace(/\s+/g,' ')}
function checkArticleLine(){
let value=$('articleanswer').value.trim();if(!value||(answers[si]||{})[qi]!==undefined)return;
let q=S[si].questions[qi],v=normalizeArticle(value),expected=normalizeArticle(q.answer);
let accepted=q.answer==='0'?['0','zero','no article','Ø'].includes(v):q.answer==='V'?['v','tick','correct'].includes(v):v===expected;
let a=answers[si]||(answers[si]={});a[qi]={text:value,ok:accepted};render();
}
function resetArticleLine(){let a=answers[si]||{};delete a[qi];render()}
function renderOne(s,a){let q=s.questions[qi],chosen=a[qi],done=Object.keys(a).length,total=s.questions.length;
let opts=q.options.map((o,i)=>`<button class="opt ${chosen!==undefined&&i===q.correct?'correct':''} ${chosen===i&&chosen!==q.correct?'wrong':''}" ${chosen!==undefined?'disabled':''} onclick="answer(${qi},${i})">${o}</button>`).join('');
let fb=chosen!==undefined?feedback(q,chosen===q.correct):'';
let intro=s.intro?`<p>${esc(s.intro)}</p>`:'';
$('main').innerHTML=`<div class="meta"><span>${esc(s.title)}</span><span>Question ${qi+1} / ${total}</span><span>Score: ${score(s,a)} / ${total}</span></div><div class="progress"><i style="width:${done/total*100}%"></i></div>${intro}${jumpButtons(total,a)}<div class="question">${q.prompt}</div><div class="opts">${opts}</div>${fb}<div class="actions"><button class="btn" onclick="previous()" ${qi===0?'disabled':''}>Previous</button><button class="btn primary" onclick="next()" ${qi===total-1?'disabled':''}>Next</button><button class="btn" onclick="resetSection()">Reset this section</button></div>`;
}
function feedback(q,correct){return `<div class="feedback ${correct?'':'bad'}"><b>${correct?'Correct!':'Incorrect.'}</b> Correct answer: <b>${q.options[q.correct]}</b><p><b>Giải thích:</b> ${q.explain}</p><p><b>Nghĩa tiếng Việt:</b> ${q.vi}</p></div>`}
function answer(i,j){let a=answers[si]||(answers[si]={});if(a[i]!==undefined)return;a[i]=j;render()}
function renderAll(s,a){let total=s.questions.length,done=Object.keys(a).length;
let passage=s.passage?`<div class="passage">${esc(Array.isArray(s.passage)?s.passage.join("\\n\\n"):s.passage)}</div><details class="translation"><summary>Show Vietnamese translation / Hiện bản dịch tiếng Việt</summary><div class="passage" style="max-height:42vh;margin-top:10px">${esc(s.translation||'')}</div></details>`:s.wordbank?`<div class="wordbank"><b>Word box:</b> ${esc(s.wordbank)}</div><div class="passage">${s.passage.map(esc).join('\\n\\n')}</div><details class="translation"><summary>Show Vietnamese translation / Hiện bản dịch tiếng Việt</summary><p>${esc(s.translation)}</p></details>`:'';
let cards=s.questions.map((q,i)=>{let c=a[i],opts=q.options.map((o,j)=>`<button class="opt ${c!==undefined&&j===q.correct?'correct':''} ${c===j&&c!==q.correct?'wrong':''}" ${c!==undefined?'disabled':''} onclick="answer(${i},${j})">${o}</button>`).join('');return `<article class="panel"><div class="meta"><b>Question ${i+1} / ${total}</b><span>${c===undefined?'Not answered':c===q.correct?'Correct':'Incorrect'}</span></div><div class="question">${q.prompt}</div><div class="opts">${opts}</div>${c!==undefined?feedback(q,c===q.correct):''}</article>`}).join('');
let body=s.mode==='reading'?`<div class="reading-layout"><section class="read-pane"><h3>Reading passage</h3>${passage}</section><section class="questions-pane"><div class="scoreline">Questions · ${done}/${total} answered · Score ${score(s,a)}/${total}</div>${cards}</section></div>`:`${passage}<div class="meta"><span>${esc(s.title)}</span><span>Answered: ${done}/${total}</span><span>Score: ${score(s,a)}/${total}</span></div>${cards}`;
$('main').innerHTML=`<div class="meta"><span>${esc(s.title)}</span><span>${s.mode==='reading'?'All questions displayed':'All questions displayed'}</span><span>Score: ${score(s,a)}/${total}</span></div><p>${esc(s.intro||'')}</p>${body}<div class="actions"><button class="btn" onclick="resetSection()">Reset this section</button></div>`;
}
function renderTypingSection(s,a){let q=s.questions[qi],v=a[qi],done=Object.keys(a).length,total=s.questions.length;
let opts=`<input class="typing" id="typeanswer" placeholder="Type the answer..." value="${v?esc(v.text):''}" ${v?'disabled':''}>`;
let fb=v?`<div class="feedback ${v.ok?'':'bad'}"><b>${v.ok?'Correct!':'Not quite.'}</b><p><b>Suggested answer:</b> ${esc(q.answer)}</p><p><b>Giải thích:</b> ${q.explain}</p><p><b>Nghĩa tiếng Việt:</b> ${q.vi}</p></div>`:'';
let hint=hints[qi]?`<div class="hint">Gợi ý: ${q.explain}</div>`:'';
$('main').innerHTML=`<div class="meta"><span>${esc(s.title)}</span><span>Question ${qi+1}/${total}</span><span>Completed ${done}/${total}</span></div><div class="progress"><i style="width:${done/total*100}%"></i></div>${s.image?`<img class="picture" src="${s.image}" alt="Vocabulary pictures for exercise 1">`:''}${jumpButtons(total,a)}<div class="question">${q.prompt}</div>${opts}${hint}${fb}<div class="actions">${v?`<button class="btn" onclick="resetTypingQuestion()">Reset this question</button>`:`<button class="btn" onclick="hints[qi]=true;render()">HINT</button><button class="btn primary" onclick="checkTyping()">CHECK</button>`}<button class="btn" onclick="previous()" ${qi===0?'disabled':''}>Previous</button><button class="btn primary" onclick="next()" ${qi===total-1?'disabled':''}>Next</button><button class="btn" onclick="resetSection()">Reset this section</button></div>`;
}
function normalize(x){return String(x).toLowerCase().replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim()}
function checkTyping(){let value=$('typeanswer').value.trim();if(!value||((answers[si]||{})[qi]!==undefined))return;let s=S[si],q=s.questions[qi],ok=normalize(value)===normalize(q.answer);let a=answers[si]||(answers[si]={});a[qi]={text:value,ok};render()}
function resetTypingQuestion(){let a=answers[si]||{};delete a[qi];delete hints[qi];render()}
function renderWriting(){let q=W[qi],v=writingAnswers[qi],total=W.length,done=Object.keys(writingAnswers).length;
let hint=hints['w'+qi]?`<div class="hint"><b>HINT:</b> ${q.explain}</div>`:'';
let fb=v?`<div class="feedback ${v.ok?'':'bad'}"><b>${v.ok?'Correct!':'Not quite.'}</b><p><b>Suggested answer:</b> ${esc(q.answer[0])}</p><p><b>Giải thích cấu trúc:</b> ${esc(q.explain)}</p><p><b>Nghĩa tiếng Việt:</b> ${esc(q.vi)}</p></div>`:'';
$('main').innerHTML=`<div class="meta"><span>Writing · Exercise 1</span><span>Question ${qi+1}/${total}</span><span>Checked ${done}/${total}</span></div><div class="progress"><i style="width:${done/total*100}%"></i></div>${jumpButtons(total,writingAnswers)}<div class="question">${esc(q.prompt)}</div><input class="typing" id="writeanswer" placeholder="Type the missing words or sentence..." value="${v?esc(v.text):''}" ${v?'disabled':''}>${hint}${fb}<div class="actions">${v?`<button class="btn" onclick="resetWritingQuestion()">Reset this question</button>`:`<button class="btn" onclick="hints['w'+qi]=true;render()">HINT</button><button class="btn primary" onclick="checkWriting()">CHECK</button>`}<button class="btn" onclick="previous()" ${qi===0?'disabled':''}>Previous</button><button class="btn primary" onclick="next()" ${qi===total-1?'disabled':''}>Next</button><button class="btn" onclick="resetSection()">Reset this section</button></div>`;
}
function checkWriting(){let value=$('writeanswer').value.trim();if(!value||writingAnswers[qi])return;let q=W[qi],ok=q.answer.some(a=>normalize(value)===normalize(a));writingAnswers[qi]={text:value,ok};render()}
function resetWritingQuestion(){delete writingAnswers[qi];delete hints['w'+qi];render()}
